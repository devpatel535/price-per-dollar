name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload the unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: price-per-dollar-unpacked
          path: dist/
          if-no-files-found: error

      - name: Upload the store archive
        uses: actions/upload-artifact@v4
        with:
          name: price-per-dollar-zip
          path: release/*.zip
          if-no-files-found: error
